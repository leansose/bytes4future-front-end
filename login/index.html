<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="pt-PT">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login">
        <form>
            <h1> Login To Your Account</h1>
            <br>
            <input class="inputfield" type="text" id="user" name="username" placeholder="Username" required><br><br>
            <input class="inputfield" type="password" id="password" name="password" placeholder="Password" required><br><br>
            <input id="loginbutton" type="submit" value="Login"><br><br>
        </form>
    </div>
</body>
</html>
