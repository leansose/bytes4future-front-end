<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 2</title>
</head>
<body>

    <!-- exemplo tabela -->
    <table border="1">
        <caption><b>A minha primeira tabela</b></caption>
        <tr>
            <th>Cabeçalho A</th>
            <th>Cabeçalho B</th>
            <th>Cabeçalho C</th>
        </tr>

        <tr>
            <td rowspan="2">A1</td>
            <td colspan="2">B1</td>
            <td>C1</td>
        </tr>

        <tr>
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
    </table>

    <hr>

    <!-- exercício 1 -->
    <table border="3">
        <tr>
            <th>Nome</th>
            <th>Número</th>
        </tr>
        <tr>
            <td>Maria</td>
            <td>4</td>
        </tr>
         <tr>
            <td>João</td>
            <td>11</td>
        </tr>
    </table>

    <!-- exercício 2 -->
    <table border="3">
        <tr>
            <th>Nome</th>
            <th>Número</th>
            <th>Idade</th>
        </tr>
        <tr>
            <td>Maria</td>
            <td>4</td>
            <td rowspan="2">35</td>
        </tr>
         <tr>
            <td>João</td>
            <td>11</td>
        </tr>
    </table>

</body>
</html>
