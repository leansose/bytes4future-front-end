<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="pt-PT">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <form>
        <fieldset>

        <legend>Dados Pessoais</legend>
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" placeholder="primeiro nome" maxlength="20">

        <br><br>

        <label for="lastname">Apelido</label>
        <input type="text" id="nome" name="lastname" placeholder="último nome" maxlength="20">

        <br><br>
        <label for="contacto">Contacto</label>
        <input type="tel" id="contacto" name="contacto" placeholder="123456789" pattern="[0-9]{9}">

        <br><br>
        <label for="mail">E-mail</label>
        <input type="email" id="email" name="mail" required>

        <br><br>

        <label for="nascimento">Data de Nascimento</label>
        <input type="date" id="nascimento" name="nascimento">

        </fieldset>

        <fieldset>
        
        <legend>Género</legend>
        <input type="radio" id="male" name="genre" value="male">
        <label for="male">Masculino</label>
        <input type="radio" id="female" name="genre" value="female">
        <label for="female">Femenino</label>
        <input type="radio" id="outro" name="genre" value="outro">
        <label for="outro">Outro</label>
        </fieldset>

        <fieldset>
        <legend>User</legend>

        <label for="user">Username</label>
        <input type="text" id="user" name="username">

        <br><br>

        <label for="password">Password</label>
        <input type="password" id="password" name="password">

        </fieldset>

        <!-- Termos e Condições -->
        <br>
        <input type="checkbox" id="policy" name="Privacidade" required>
        <label  for="policy">Aceito a Política de Privacidade</label>
        <br>
        <input type="checkbox" id="termos" name="Privacidade" required>
        <label  for="termos">Termos e Condições</label>
        
        <br><br>

        <input type="submit" value="Submeter">
        <input type="reset" value="Limpar">

    </form>
</body>
</html>
